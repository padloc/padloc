[package]
name = "padloc"
version = "4.3.0"
description = "Padloc"
authors = [ "Martin Kleinschrodt <martin@maklesoft.com>" ]
license = "GPL-3.0"
repository = "https://github.com/padloc/padloc"
default-run = "padloc"
edition = "2021"
build = "src/build.rs"

[lib]
name = "padloc_lib"
crate-type = [ "staticlib", "cdylib", "rlib" ]

[build-dependencies.tauri-build]
version = "2"
features = [ ]

[build-dependencies.cc]
version = "1"

[dependencies]
serde_json = "1"
tauri-plugin-clipboard-manager = "=2.5.0"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-os = "=2.4.0"

  [dependencies.tauri-plugin-privacy-cover]
  path = "../plugins/privacy-cover"

  [dependencies.tauri-plugin-biometric-keystore]
  path = "../plugins/biometric-keystore"

  [dependencies.tauri-plugin-file-sharing]
  path = "../plugins/file-sharing"

  [dependencies.tauri]
  version = "2"
  features = [ ]

[target."cfg(any(target_os = \"ios\", target_os = \"android\"))".dependencies]
tauri-plugin-barcode-scanner = "=2.5.3"

[target."cfg(not(any(target_os = \"ios\", target_os = \"android\")))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
migration-probe = [ ]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true
