[package]
name = "padloc"
version = "4.3.0"
description = "Padloc"
authors = [ "Martin Kleinschrodt <martin@maklesoft.com>" ]
license = "GPL-3.0"
repository = "https://github.com/padloc/padloc"
default-run = "padloc"
edition = "2021"
build = "src/build.rs"

[build-dependencies.tauri-build]
version = "2"
features = [ ]

[dependencies]
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

  [dependencies.tauri]
  version = "2"
  features = [ ]

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true
