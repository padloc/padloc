name: padloc-staging
services:
    server:
        image: ${SERVER_IMAGE:?required}
        environment:
            PL_SERVER_CLIENT_URL: https://${STAGING_HOST:?required}
            PL_DATA_BACKEND: leveldb
            PL_DATA_LEVELDB_DIR: /data
            PL_ATTACHMENTS_BACKEND: fs
            PL_ATTACHMENTS_FS_DIR: /attachments
            PL_EMAIL_BACKEND: console
        volumes:
            - data:/data
            - attachments:/attachments
        restart: unless-stopped
    pwa:
        image: ${PWA_IMAGE:?required}
        environment:
            PL_SERVER_URL: https://${STAGING_HOST}/server
            PL_PWA_URL: https://${STAGING_HOST}
            PL_PWA_DIR: /pwa
        restart: unless-stopped
    caddy:
        image: caddy:2
        environment:
            STAGING_HOST: ${STAGING_HOST}
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
        restart: unless-stopped
volumes:
    data:
    attachments:
    caddy_data:
    caddy_config:
