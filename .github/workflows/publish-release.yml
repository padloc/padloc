name: Publish Release

on:
    workflow_dispatch:
        inputs:
            environment:
                type: environment
                default: "Beta"
            vendor_version:
                type: string
                description: "Vendor Version (semver) for the release -- what will be visible."
                default: "0.0.1"
                required: true
            build:
                type: string
                description: "Build number (int, 3 max digits) for the release."
                default: "0"
                required: true

jobs:
    create_release_tag:
        permissions:
            contents: write
        name: "Create release tag"
        environment: ${{ github.event.inputs.environment || 'Beta' }}
        env:
            PL_VENDOR_VERSION: ${{ github.event.inputs.vendor_version || '0.0.1' }}
            PL_VENDOR_BASE_URL: "https://github.com/${{ github.repository }}"

        runs-on: ubuntu-latest
        outputs:
            release_id: ${{ steps.create_release.outputs.id }}
        steps:
            - uses: actions/checkout@v4
            - uses: softprops/action-gh-release@v2
              id: create_release
              name: Create release
              with:
                  tag_name: "v${{ env.PL_VENDOR_VERSION }}"
                  name: "v${{ env.PL_VENDOR_VERSION }}"
                  body: "v${{ env.PL_VENDOR_VERSION }}"
                  prerelease: true
                  target_commitish: ${{ github.sha }}
                  draft: false

    release_web_extension:
        name: "Release web extension"
        environment: ${{ github.event.inputs.environment || 'Beta' }}
        needs: create_release_tag
        env:
            RELEASE_BUILD: ${{ github.event.inputs.build || '0' }}
            PL_VENDOR_VERSION: ${{ github.event.inputs.vendor_version || '0.0.1' }}

        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
            - name: Install dependencies
              run: |
                  npm i -g npm@8.2.0 web-ext@6.6.0
                  npm ci
            - name: Build
              env:
                  PL_SERVER_URL: ${{ secrets.PL_SERVER_URL }}
                  PL_BUILD_ENV: ${{ secrets.PL_BUILD_ENV }}
              run: npm run web-extension:build
            - name: Build Firefox extension
              env:
                  PL_SERVER_URL: ${{ secrets.PL_SERVER_URL }}
                  PL_EXTENSION_BROWSER: firefox
                  PL_WEB_EXTENSION_FIREFOX_ID: ${{ secrets.PL_WEB_EXTENSION_FIREFOX_ID }}
              run: npm run web-extension:build
            - name: Pack Firefox extension
              uses: cardinalby/webext-buildtools-pack-extension-dir-action@v1
              with:
                  extensionDir: packages/extension/dist-firefox
                  zipFilePath: packages/extension/padloc-firefox.zip
                  zipIgnore: web-ext-artifacts/**|*.xpi
            - name: Upload Unsigned Firefox Extension
              uses: svenstaro/upload-release-action@2.2.1
              with:
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  tag: "v${{ env.PL_VENDOR_VERSION }}"
                  file: packages/extension/padloc-firefox.zip
                  asset_name: padloc_${{ env.PL_VENDOR_VERSION }}_web-extension_firefox_unsigned.zip
                  prerelease: true
            # - name: Sign for Firefox
            #   run: cd packages/extension/dist-firefox && web-ext sign --id="${{ secrets.PL_WEB_EXTENSION_FIREFOX_ID }}" --channel=unlisted --api-key=${{ secrets.PL_WEB_EXTENSION_FIREFOX_API_KEY }} --api-secret=${{ secrets.PL_WEB_EXTENSION_FIREFOX_API_SECRET }}
            # - name: Upload Signed Web Extension (Firefox)
            #   uses: svenstaro/upload-release-action@2.2.1
            #   with:
            #       repo_token: ${{ secrets.GITHUB_TOKEN }}
            #       tag: "v${{ env.PL_VENDOR_VERSION }}"
            #       file: packages/extension/dist-firefox/web-ext-artifacts/padloc-${{ env.PL_VENDOR_VERSION }}.${{ env.RELEASE_BUILD }}.xpi
            #       asset_name: padloc_${{ env.PL_VENDOR_VERSION }}_web-extension_firefox.xpi
            #       prerelease: true
            - name: Pack for Chrome/Edge Extension
              uses: cardinalby/webext-buildtools-pack-extension-dir-action@v1
              with:
                  extensionDir: packages/extension/dist
                  zipFilePath: packages/extension/padloc.zip
                  zipIgnore: web-ext-artifacts/**|*.xpi
            - name: Upload Unsigned Web Extension (Chrome/Edge)
              uses: svenstaro/upload-release-action@2.2.1
              with:
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  tag: "v${{ env.PL_VENDOR_VERSION }}"
                  file: packages/extension/padloc.zip
                  asset_name: padloc_${{ env.PL_VENDOR_VERSION }}_web-extension_unsigned.zip
                  prerelease: true
            - name: Sign for Chrome/Edge
              uses: cardinalby/webext-buildtools-chrome-crx-action@v2
              with:
                  zipFilePath: packages/extension/padloc.zip
                  crxFilePath: packages/extension/padloc-signed.crx
                  privateKey: ${{ secrets.PL_WEB_EXTENSION_CHROME_CRX_PRIVATE_KEY }}
            - name: Upload Signed Web Extension (Chrome/Edge)
              uses: svenstaro/upload-release-action@2.2.1
              with:
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  tag: "v${{ env.PL_VENDOR_VERSION }}"
                  file: packages/extension/padloc-signed.crx
                  asset_name: padloc_${{ env.PL_VENDOR_VERSION }}_web-extension_chrome.crx
                  prerelease: true
            # - name: Generate checksum (xpi)
            #   run: |
            #       cd packages/extension/dist-firefox/web-ext-artifacts
            #       sha256sum padloc*.xpi > sha256sum-xpi.txt
            # - name: Upload checksum (xpi)
            #   uses: svenstaro/upload-release-action@2.2.1
            #   with:
            #       repo_token: ${{ secrets.GITHUB_TOKEN }}
            #       tag: "v${{ env.PL_VENDOR_VERSION }}"
            #       file: packages/extension/dist-firefox/web-ext-artifacts/sha256sum-xpi.txt
            #       asset_name: sha256sum-xpi.txt
            #       prerelease: true
            - name: Generate checksum (crx)
              run: |
                  cd packages/extension
                  sha256sum padloc-signed.crx > sha256sum-crx.txt
            - name: Upload checksum (crx)
              uses: svenstaro/upload-release-action@2.2.1
              with:
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  tag: "v${{ env.PL_VENDOR_VERSION }}"
                  file: packages/extension/sha256sum-crx.txt
                  asset_name: sha256sum-crx.txt
                  prerelease: true

    release_tauri:
        name: "Build signed Tauri apps"
        environment: ${{ github.event.inputs.environment || 'Beta' }}
        needs: create_release_tag
        permissions:
            contents: read
        env:
            PL_VENDOR_VERSION: ${{ github.event.inputs.vendor_version }}
            PL_VENDOR_BASE_URL: "https://github.com/${{ github.repository }}"

        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-15-intel
                      target: x86_64-apple-darwin
                      platform: darwin-x86_64
                      bundles: app,dmg
                    - os: macos-latest
                      target: aarch64-apple-darwin
                      platform: darwin-aarch64
                      bundles: app,dmg
                    - os: ubuntu-22.04
                      target: x86_64-unknown-linux-gnu
                      platform: linux-x86_64
                      bundles: deb,appimage
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      platform: windows-x86_64
                      bundles: msi

        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: packages/tauri/src-tauri -> target
                  key: ${{ matrix.target }}
            - name: Install Linux dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
            - name: Install dependencies
              run: |
                  npm i -g npm@8.2.0
                  npm ci --ignore-scripts
                  npx lerna bootstrap --scope @padloc/tauri --include-dependencies
            - name: Test release manifest generation
              run: npm run test:release --prefix packages/tauri
            - name: Configure release version before the CLI reads it
              run: npm run update:config --prefix packages/tauri
            - name: Build signed bundles
              uses: tauri-apps/tauri-action@v0
              env:
                  PL_SERVER_URL: ${{ secrets.PL_SERVER_URL }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
                  APPLE_CERTIFICATE: ${{ secrets.PL_MACOS_SIGNING_CERT_BASE64 }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.PL_MACOS_SIGNING_CERT_PASSWORD }}
                  APPLE_SIGNING_IDENTITY: ${{ secrets.PL_MACOS_SIGNING_IDENTITY }}
                  APPLE_ID: ${{ secrets.PL_MACOS_NOTARIZE_APPLE_ID }}
                  APPLE_PASSWORD: ${{ secrets.PL_MACOS_NOTARIZE_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.PL_IOS_DEVELOPMENT_TEAM }}
              with:
                  projectPath: packages/tauri
                  args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
            - name: Stage signed artifacts and manifest fragment
              run: node packages/tauri/generate-tauri-update-file.js stage ${{ matrix.platform }} packages/tauri/src-tauri/target/${{ matrix.target }}/release/bundle packages/tauri/release-artifacts
            - uses: actions/upload-artifact@v4
              with:
                  name: tauri-release-${{ matrix.platform }}
                  path: packages/tauri/release-artifacts/*
                  if-no-files-found: error

    publish_tauri:
        name: "Publish complete Tauri update feed"
        needs: [create_release_tag, release_tauri]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        env:
            PL_VENDOR_VERSION: ${{ github.event.inputs.vendor_version }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
            - name: Install dependencies
              run: |
                  npm i -g npm@8.2.0
                  npm ci --ignore-scripts
                  npx lerna bootstrap --scope @padloc/tauri --include-dependencies
            - uses: actions/download-artifact@v4
              with:
                  pattern: tauri-release-*
                  path: packages/tauri/release-artifacts
                  merge-multiple: true
            - name: Generate complete update feed
              run: node packages/tauri/generate-tauri-update-file.js merge packages/tauri/release-artifacts packages/tauri/tauri-update.json
            - name: Upload signed bundles
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release upload "v$PL_VENDOR_VERSION" packages/tauri/release-artifacts/*.app.tar.gz* packages/tauri/release-artifacts/*.AppImage* packages/tauri/release-artifacts/*.msi* packages/tauri/release-artifacts/*.dmg packages/tauri/release-artifacts/*.deb packages/tauri/release-artifacts/*.txt --clobber
            - name: Publish feed after all bundles are uploaded
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release upload "v$PL_VENDOR_VERSION" packages/tauri/tauri-update.json --clobber

            - name: Promote complete production release
              if: github.event.inputs.environment == 'Production'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release edit "v$PL_VENDOR_VERSION" --prerelease=false --latest

    release_electron:
        name: "Release Electron apps"
        environment: ${{ github.event.inputs.environment || 'Beta' }}
        needs: create_release_tag
        env:
            RELEASE_ID: ${{ needs.create_release_tag.outputs.release_id }}
            PL_VENDOR_VERSION: ${{ github.event.inputs.vendor_version || '0.0.1' }}

        strategy:
            fail-fast: false
            matrix:
                platform: [macos-latest, ubuntu-latest, windows-latest]

        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
            - name: Install coreutils
              if: matrix.platform == 'macos-latest'
              run: |
                  brew install coreutils
            - name: Install Flatpak build tools
              if: matrix.platform == 'ubuntu-latest'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y flatpak flatpak-builder
                  flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
            - name: Install dependencies
              run: |
                  npm i -g npm@8.2.0
                  npm ci
            - name: Build
              run: |
                  npm run electron:build
              env:
                  PL_PWA_URL: ${{ secrets.PL_PWA_URL }}
                  CSC_LINK: ${{ secrets.PL_MACOS_SIGNING_CERT_BASE64 }}
                  CSC_KEY_PASSWORD: ${{ secrets.PL_MACOS_SIGNING_CERT_PASSWORD }}
                  PL_MACOS_NOTARIZE_APPLE_ID: ${{ secrets.PL_MACOS_NOTARIZE_APPLE_ID }}
                  PL_MACOS_NOTARIZE_PASSWORD: ${{ secrets.PL_MACOS_NOTARIZE_PASSWORD }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  EP_PRE_RELEASE: true
            - name: Build Flatpak
              if: matrix.platform == 'ubuntu-latest'
              run: |
                  npm run electron:build:flatpak
              env:
                  PL_PWA_URL: ${{ secrets.PL_PWA_URL }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  EP_PRE_RELEASE: true
            - name: Generate checksum (AppImage)
              if: matrix.platform == 'ubuntu-latest'
              run: |
                  cd packages/electron/dist
                  sha256sum *.AppImage > sha256sum-appimage.txt
            - name: Upload checksum (AppImage)
              if: matrix.platform == 'ubuntu-latest'
              uses: svenstaro/upload-release-action@2.2.1
              with:
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  tag: "v${{ env.PL_VENDOR_VERSION }}"
                  file: packages/electron/dist/sha256sum-appimage.txt
                  asset_name: sha256sum-electron-appimage.txt
                  prerelease: true
            - name: Generate checksum (deb)
              if: matrix.platform == 'ubuntu-latest'
              run: |
                  cd packages/electron/dist
                  sha256sum *.deb > sha256sum-deb.txt
            - name: Upload checksum (deb)
              if: matrix.platform == 'ubuntu-latest'
              uses: svenstaro/upload-release-action@2.2.1
              with:
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  tag: "v${{ env.PL_VENDOR_VERSION }}"
                  file: packages/electron/dist/sha256sum-deb.txt
                  asset_name: sha256sum-electron-deb.txt
                  prerelease: true
            - name: Generate checksum (snap)
              if: matrix.platform == 'ubuntu-latest'
              run: |
                  cd packages/electron/dist
                  sha256sum *.snap > sha256sum-snap.txt
            - name: Upload checksum (snap)
              if: matrix.platform == 'ubuntu-latest'
              uses: svenstaro/upload-release-action@2.2.1
              with:
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  tag: "v${{ env.PL_VENDOR_VERSION }}"
                  file: packages/electron/dist/sha256sum-snap.txt
                  asset_name: sha256sum-electron-snap.txt
                  prerelease: true
            - name: Generate checksum (flatpak)
              if: matrix.platform == 'ubuntu-latest'
              run: |
                  cd packages/electron/dist
                  sha256sum *.flatpak > sha256sum-flatpak.txt
            - name: Upload checksum (flatpak)
              if: matrix.platform == 'ubuntu-latest'
              uses: svenstaro/upload-release-action@2.2.1
              with:
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  tag: "v${{ env.PL_VENDOR_VERSION }}"
                  file: packages/electron/dist/sha256sum-flatpak.txt
                  asset_name: sha256sum-electron-flatpak.txt
                  prerelease: true
            - name: Generate checksum (dmg)
              if: matrix.platform == 'macos-latest'
              run: |
                  cd packages/electron/dist
                  sha256sum *.dmg > sha256sum-dmg.txt
            - name: Upload checksum (dmg)
              if: matrix.platform == 'macos-latest'
              uses: svenstaro/upload-release-action@2.2.1
              with:
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  tag: "v${{ env.PL_VENDOR_VERSION }}"
                  file: packages/electron/dist/sha256sum-dmg.txt
                  asset_name: sha256sum-electron-dmg.txt
                  prerelease: true
            - name: Generate checksum (exe)
              if: matrix.platform == 'windows-latest'
              run: |
                  cd packages/electron/dist
                  sha256sum *.exe > sha256sum-exe.txt
            - name: Upload checksum (exe)
              if: matrix.platform == 'windows-latest'
              uses: svenstaro/upload-release-action@2.2.1
              with:
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  tag: "v${{ env.PL_VENDOR_VERSION }}"
                  file: packages/electron/dist/sha256sum-exe.txt
                  asset_name: sha256sum-electron-exe.txt
                  prerelease: true

    release_cordova:
