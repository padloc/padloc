name: Update Dockerhub

on:
    workflow_dispatch:

    push:
        branches:
            - "main"
        paths:
            - "packages/app/**"
            - "packages/core/**"
            - "packages/locale/**"
            - "assets/**"

jobs:
    update_dockerhub:
        name: "Update DockerHub"
        uses: ./.github/workflows/build-docker-images.yml
        with:
            tag: "latest"
        secrets: inherit
