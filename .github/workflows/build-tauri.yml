name: Build Tauri

on:
    workflow_dispatch:
        inputs:
            environment:
                type: environment
                default: "Local"

    push:
        branches:
            - "main"
            - "feature/**"
            - "fix/**"
        paths:
            - "packages/app/**"
            - "packages/core/**"
            - "packages/tauri/**"
            - "packages/locale/**"
            - "assets/**"
            - ".github/workflows/build-tauri.yml"
            - "package.json"

    pull_request:
        paths:
            - "packages/tauri/**"
            - "packages/app/**"
            - "packages/core/**"
            - "packages/locale/**"
            - "assets/**"
            - ".github/workflows/build-tauri.yml"
            - "package.json"

jobs:
    build:
        environment: ${{ github.event.inputs.environment || 'Local' }}

        strategy:
            fail-fast: false
            matrix:
                config:
                    - os: ubuntu-22.04
                      arch: x86_64
                      rust_target: x86_64-unknown-linux-gnu
                      bundles: deb,appimage
                    - os: macos-15-intel
                      arch: x86_64
                      rust_target: x86_64-apple-darwin
                      bundles: app,dmg
                    - os: macos-latest
                      arch: aarch64
                      rust_target: aarch64-apple-darwin
                      bundles: app,dmg
                    - os: windows-latest
                      arch: x86_64
                      rust_target: x86_64-pc-windows-msvc
                      bundles: msi

        runs-on: ${{ matrix.config.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
            - name: "Setup Rust"
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.config.rust_target }}
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: packages/tauri/src-tauri -> target
                  key: ${{ matrix.config.rust_target }}
            - name: Install webkit2gtk (ubuntu only)
              if: matrix.config.os == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf xvfb
            - name: Install dependencies
              run: |
                  npm i -g npm@8.2.0
                  npm ci --ignore-scripts
                  npx lerna bootstrap --scope @padloc/tauri --include-dependencies
            - name: Test release manifest generation
              run: npm run test:release --prefix packages/tauri
            - name: Build (debug)
              if: github.event.inputs.environment != 'Production'
              run: npm run tauri:build:debug -- --target ${{ matrix.config.rust_target }} --bundles ${{ matrix.config.bundles }}
              env:
                  PL_SERVER_URL: ${{ secrets.PL_SERVER_URL }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
            - name: Build (production)
              if: github.event.inputs.environment == 'Production'
              run: npm run tauri:build -- --target ${{ matrix.config.rust_target }} --bundles ${{ matrix.config.bundles }}
              env:
                  PL_SERVER_URL: ${{ secrets.PL_SERVER_URL }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
            - name: Smoke-test Linux startup
              if: runner.os == 'Linux'
              env:
                  WEBKIT_DISABLE_DMABUF_RENDERER: "1"
              run: xvfb-run -a node packages/tauri/test/launch.js packages/tauri/src-tauri/target/${{ matrix.config.rust_target }}/${{ github.event.inputs.environment == 'Production' && 'release' || 'debug' }}/padloc
            - name: Smoke-test macOS and Windows startup
              if: runner.os != 'Linux'
              run: node packages/tauri/test/launch.js packages/tauri/src-tauri/target/${{ matrix.config.rust_target }}/${{ github.event.inputs.environment == 'Production' && 'release' || 'debug' }}/padloc${{ runner.os == 'Windows' && '.exe' || '' }}
            - name: Archive AppImage
              uses: actions/upload-artifact@v4
              if: matrix.config.os == 'ubuntu-22.04'
              with:
                  name: padloc-linux-${{ github.sha }}-unsigned.AppImage
                  path: packages/tauri/src-tauri/target/${{ matrix.config.rust_target }}/${{ github.event.inputs.environment == 'Production' && 'release' || 'debug' }}/bundle/appimage/padloc*.AppImage
                  if-no-files-found: error
            - name: Archive deb
              uses: actions/upload-artifact@v4
              if: matrix.config.os == 'ubuntu-22.04'
              with:
                  name: padloc-linux-${{ github.sha }}-unsigned.deb
                  path: packages/tauri/src-tauri/target/${{ matrix.config.rust_target }}/${{ github.event.inputs.environment == 'Production' && 'release' || 'debug' }}/bundle/deb/*.deb
                  if-no-files-found: error
            - name: Archive dmg
              uses: actions/upload-artifact@v4
              if: runner.os == 'macOS'
              with:
                  name: padloc-macos-${{ matrix.config.arch }}-${{ github.sha }}-unsigned.dmg
                  path: packages/tauri/src-tauri/target/${{ matrix.config.rust_target }}/${{ github.event.inputs.environment == 'Production' && 'release' || 'debug' }}/bundle/dmg/*.dmg
                  if-no-files-found: error
            - name: Archive app
              uses: actions/upload-artifact@v4
              if: runner.os == 'macOS'
              with:
                  name: padloc-macos-${{ matrix.config.arch }}-${{ github.sha }}-unsigned.app
                  path: packages/tauri/src-tauri/target/${{ matrix.config.rust_target }}/${{ github.event.inputs.environment == 'Production' && 'release' || 'debug' }}/bundle/macos/*.app
                  if-no-files-found: error
            - name: Archive msi
              uses: actions/upload-artifact@v4
              if: matrix.config.os == 'windows-latest'
              with:
                  name: padloc-windows-${{ github.sha }}-unsigned.msi
                  path: packages/tauri/src-tauri/target/${{ matrix.config.rust_target }}/${{ github.event.inputs.environment == 'Production' && 'release' || 'debug' }}/bundle/msi/*.msi
                  if-no-files-found: error
