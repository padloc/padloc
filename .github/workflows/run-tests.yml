name: Run Tests

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
            - uses: actions/cache@v4
              with:
                  path: ~/.npm
                  key: npm-${{ runner.os }}-${{ runner.arch }}-node26.12.1-npm11.20.0-${{ hashFiles('package-lock.json') }}
            - name: Install dependencies
              run: |
                  npm i -g npm@11.20.0
                  npm ci
            - name: Run prettier check
              run: npm run prettier:check
            - name: Run translation checks
              run: |
                  npm run locale:extract
                  if [ $(git status --porcelain | wc -l) -ne "0" ]; then
                    echo "Missing translations detected."
                    exit 1
                  fi
            - name: Run pwa test build
              run: npm run pwa:build
            - name: Run admin test build
              run: npm run admin:build
            - name: Run Chromium extension test build
              run: npm run web-extension:build
            - name: Run Firefox extension test build
              run: PL_EXTENSION_BROWSER=firefox npm run web-extension:build
            - name: Run Safari extension test build
              run: PL_EXTENSION_BROWSER=safari npm run web-extension:build
            - name: Test starting zero-config community server
              run: npm run server:start-dry
            - name: Validate enterprise server composition without listeners
              run: npm run server:start-dry:enterprise
            - name: Run tests
              run: npm test
            - name: Test built extension worker lifecycle
              run: npm run test:worker --workspace @padloc/extension
            - name: Test built Safari background lifecycle
              run: PL_EXTENSION_BROWSER=safari npm run test:worker --workspace @padloc/extension
            - name: Run end-to-end tests
              env:
                  PL_SERVER_URL: http://localhost:3000
                  PL_PWA_URL: http://localhost:8080
              run: xvfb-run -a npm run test:e2e

    docker:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                package: [server, pwa, server-enterprise]
        steps:
            - uses: actions/checkout@v4
            - name: Build with only the required package files
              run: docker build -f Dockerfile-${{ matrix.package }} -t padloc-check .
            - name: Verify community image excludes enterprise source and Stripe
              if: matrix.package == 'server'
              run: |
                  docker run --rm --entrypoint node padloc-check -e '
                    const assert = require("node:assert/strict");
                    const fs = require("node:fs");
                    assert.equal(fs.existsSync("/padloc/enterprise/server/src"), false);
                    for (const file of ["api.ts", "stripe.ts"]) {
                      assert.equal(fs.existsSync(`/padloc/packages/server/src/provisioning/${file}`), false);
                    }
                    assert.throws(() => require.resolve("stripe"), { code: "MODULE_NOT_FOUND" });
                  '
            - name: Validate container build or startup
              run: |
                  if [ "${{ matrix.package }}" = "pwa" ]; then
                    docker run --rm --entrypoint npm padloc-check run build --workspace @padloc/pwa
                  elif [ "${{ matrix.package }}" = "server-enterprise" ]; then
                    docker run --rm --entrypoint npm padloc-check run start-dry --workspace @padloc/server-enterprise
                  else
                    docker run --rm --entrypoint npm padloc-check run start-dry --workspace @padloc/server
                  fi
