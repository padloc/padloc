name: Build Docker Images

on:
    workflow_call:
        inputs:
            tag:
                description: "Tag to publish the images under, e.g. `latest` or `v4.3.0`."
                type: string
                required: true

jobs:
    build:
        name: Build (${{ matrix.image }}, ${{ matrix.platform }})
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: false
            matrix:
                image: [server, pwa]
                platform: [linux/amd64, linux/arm64]
                include:
                    - platform: linux/amd64
                      runner: ubuntu-26.04
                    - platform: linux/arm64
                      runner: ubuntu-26.04-arm
        steps:
            - name: Prepare
              run: |
                  platform=${{ matrix.platform }}
                  echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

            - name: Check out the repo
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            # Each runner builds its own architecture natively and pushes the result by
            # digest only (no tag). The `merge` job below stitches the digests together
            # into a single multi-arch tag.
            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Dockerfile-${{ matrix.image }}
                  platforms: ${{ matrix.platform }}
                  provenance: false
                  cache-from: type=gha,scope=${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
                  outputs: type=image,name=padloc/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true

            - name: Export digest
              run: |
                  mkdir -p ${{ runner.temp }}/digests
                  digest="${{ steps.build.outputs.digest }}"
                  touch "${{ runner.temp }}/digests/${digest#sha256:}"

            - name: Upload digest
              uses: actions/upload-artifact@v4
              with:
                  name: digests-${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
                  path: ${{ runner.temp }}/digests/*
                  if-no-files-found: error
                  retention-days: 1

    merge:
        name: Merge manifests (${{ matrix.image }})
        runs-on: ubuntu-26.04
        needs: build
        strategy:
            fail-fast: false
            matrix:
                image: [server, pwa]
        steps:
            - name: Download digests
              uses: actions/download-artifact@v4
              with:
                  path: ${{ runner.temp }}/digests
                  pattern: digests-${{ matrix.image }}-*
                  merge-multiple: true

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Create manifest list and push
              working-directory: ${{ runner.temp }}/digests
              run: |
                  docker buildx imagetools create -t padloc/${{ matrix.image }}:${{ inputs.tag }} \
                    $(printf 'padloc/${{ matrix.image }}@sha256:%s ' *)

            - name: Inspect image
              run: docker buildx imagetools inspect padloc/${{ matrix.image }}:${{ inputs.tag }}
